<title>Music - coleswebsite.xyz</title>
<style>
  /* Normal page: same vintage look as the rest of the site, no effects until playback. */
  body.music-page { min-height: 100vh; }
  body.music-page .content { max-width: 760px; }
  body.music-page .col-main { width: 100%; }
  body.music-page .box-body { min-height: 240px; }
  .music-caption {
    margin: 0 auto 20px;
    max-width: 520px;
    text-align: center;
    color: #555;
    font-size: 15px;
  }
  .music-preview {
    width: min(540px, 100%);
    box-sizing: border-box;
    margin: 22px auto;
    padding: 12px;
    border: 1px solid #d6d6d6;
    border-radius: 8px;
    background: #fff;
  }
  .music-preview audio { display: block; width: 100%; }
  /* ===== SPACE MODE: the moment the song plays, the page slowly fades into empty space with twinkling stars.
     Once it has fully faded in, the player starts floating in zero gravity. ===== */
  body.space-on { overflow: hidden; }
  :root { --beat: 0; }

  #space-stage {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9000; pointer-events: none; opacity: 0;
    transition: opacity .7s ease;                  /* quick fade back to the normal page on pause */
    background: radial-gradient(ellipse at 50% 50%, #05060f 0%, #000 85%);
  }
  body.space-on #space-stage { opacity: 1; pointer-events: auto; transition: opacity 3s ease-in-out; }
  #space-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  /* the player: stays exactly where it is while the page fades, blends into the dark, then floats */
  #music-preview-player { transition: background-color 3s ease, box-shadow 3s ease, border-color 3s ease; }
  body.space-on #music-preview-player {
    position: fixed; z-index: 10010;
    left: 0; top: 0; bottom: auto;
    width: min(540px, calc(100vw - 36px));
    margin: 0; padding: 10px; box-sizing: border-box;
    border: 3px outset #9aa; border-radius: 0;
    background-color: rgba(40,44,70,.55);
    box-shadow: 0 0 30px 4px rgba(120,170,255,.35), 0 0 90px 16px rgba(150,110,255,.22);
    will-change: transform;
  }
  body.space-on #music-preview-audio { display: block; width: 100%; }
</style>
