<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>music - coleswebsite.xyz</title>
<link rel="stylesheet" href="/site.css">
<style>
  /* Normal page: clean, readable, and no space effects until playback. */
  body.music-space {
    min-height: 100vh;
    background: #f5f5f5;
    color: #222;
    overflow-x: hidden;
  }
  body.music-space { background: #f5f5f5; }
  body.music-space .wrap {
    width: min(1100px, calc(100% - 28px));
    border: 0;
    background: transparent;
  }
  body.music-space .header { padding-inline: 0; }
  body.music-space .goldbar { height: 3px; }
  body.music-space .content { max-width: 760px; padding: 24px 0; }
  body.music-space .col-main { width: 100%; }
  body.music-space .box-title {
    font-size: 28px;
    border: 0;
    border-radius: 8px 8px 0 0;
  }
  body.music-space .box-body {
    min-height: 240px;
    padding: 24px;
    border: 1px solid #e4e4e7;
    border-top: 0;
    border-radius: 0 0 8px 8px;
    background: #fff;
  }
  body.music-space .footer {
    border: 0;
    border-radius: 8px;
  }
  .space-caption {
    margin: 0 auto 20px;
    max-width: 520px;
    text-align: center;
    color: #555;
    font-size: 15px;
  }
  .music-preview {
    width: min(540px, 100%);
    box-sizing: border-box;
    margin: 22px auto;
    padding: 12px;
    border: 1px solid #d6d6d6;
    border-radius: 8px;
    background: #fff;
  }
  .music-preview audio { display: block; width: 100%; }
  /* During playback, the site disappears into a black starfield. */
  body.audio-playing {
    background: #02030a !important;
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
  }
  body.audio-playing::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: 10000;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 8% 17%, #fff, transparent 2px),
      radial-gradient(1px 1px at 21% 72%, #c9ddff, transparent 2px),
      radial-gradient(1px 1px at 37% 31%, #fff, transparent 2px),
      radial-gradient(1px 1px at 49% 83%, #fff, transparent 2px),
      radial-gradient(2px 2px at 63% 13%, #d8c5ff, transparent 3px),
      radial-gradient(1px 1px at 78% 61%, #fff, transparent 2px),
      radial-gradient(1px 1px at 91% 28%, #c7e8ff, transparent 2px),
      radial-gradient(1px 1px at 73% 91%, #fff, transparent 2px),
      radial-gradient(1px 1px at 15% 49%, #fff, transparent 2px),
      radial-gradient(1px 1px at 57% 54%, #fff, transparent 2px);
    background-size: 290px 240px, 370px 310px, 230px 290px, 410px 350px, 330px 270px, 260px 320px, 390px 280px, 310px 360px, 350px 260px, 280px 300px;
    animation: stars-travel 100s linear infinite;
  }
  body.audio-playing::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 10001;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,.5) 100%);
  }
  /* Hide every site element while preserving the actual audio controls. */
  body.audio-playing .wrap,
  body.audio-playing .wrap * {
    animation: fade-into-black .45s ease forwards !important;
    pointer-events: none !important;
  }
  @keyframes fade-into-black {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  body.audio-playing #music-preview-player,
  body.audio-playing #music-preview-audio {
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    animation: none !important;
  }
  body.audio-playing #music-preview-player {
    position: fixed;
    z-index: 10010;
    left: 50%;
    top: 50%;
    width: min(540px, calc(100vw - 36px));
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #35394a;
    border-radius: 8px;
    background: #11131b;
    box-shadow: none;
    backdrop-filter: none;
    transform: translate(-50%, -50%);
    animation: zero-gravity 18s ease-in-out infinite;
  }
  body.audio-playing #music-preview-audio {
    display: block;
    width: 100%;
    filter: none;
  }
  @keyframes stars-travel {
    from { transform: translateY(0); }
    to { transform: translateY(-160px); }
  }
  @keyframes zero-gravity {
    0%   { left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-1deg); }
    17%  { left: 68%; top: 39%; transform: translate(-50%, -50%) rotate(2deg); }
    34%  { left: 72%; top: 62%; transform: translate(-50%, -50%) rotate(1deg); }
    51%  { left: 43%; top: 68%; transform: translate(-50%, -50%) rotate(-2deg); }
    68%  { left: 27%; top: 45%; transform: translate(-50%, -50%) rotate(1deg); }
    84%  { left: 39%; top: 31%; transform: translate(-50%, -50%) rotate(-1deg); }
    100% { left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-1deg); }
  }
  @media (max-width: 600px) {
    body.music-space .header { display: block; }
    body.music-space .box-body { padding: 18px 10px; }
    body.audio-playing #music-preview-player { width: calc(100vw - 28px); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.audio-playing::before,
    body.audio-playing #music-preview-player { animation: none !important; }
  }
</style>
</head>

</div>
<script>
  (function () {
    var audio = document.getElementById("music-preview-audio");
    if (!audio) return;
    function startSpacePlayer() { document.body.classList.add("audio-playing"); }
    function stopSpacePlayer() { document.body.classList.remove("audio-playing"); }
    audio.addEventListener("play", startSpacePlayer);
    audio.addEventListener("pause", stopSpacePlayer);
    audio.addEventListener("ended", stopSpacePlayer);
    audio.addEventListener("error", stopSpacePlayer);
    window.addEventListener("pagehide", stopSpacePlayer);
    if (!audio.paused && !audio.ended) startSpacePlayer();
  })();
</script>
</body>
</html>
