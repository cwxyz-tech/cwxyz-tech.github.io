  .pf-callout small { display: block; font-size: 15px; color: #fff; margin-top: 4px; }
  .pf-callout.show { animation: pf-blink 1.1s steps(1) forwards; }
  @keyframes pf-blink { 0% { opacity: 1; } 12% { opacity: 0; } 22% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

  .pf-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; background: rgba(0,0,0,.45); line-height: 1.3; }

<style>
  /* Lines DX is all Comic Sans. Phones don't ship Comic Sans, so they get Comic Neue (a free lookalike) from /fonts */
  @font-face { font-family: "CwComic"; font-weight: 400; font-display: swap;
    src: local("Comic Sans MS"), local("ComicSansMS"), local("ComicSansMS-Regular"), url("/fonts/ComicNeue-Regular.woff2") format("woff2"); }
  @font-face { font-family: "CwComic"; font-weight: 700; font-display: swap;
    src: local("Comic Sans MS Bold"), local("ComicSansMS-Bold"), url("/fonts/ComicNeue-Bold.woff2") format("woff2"); }
  .content.pf, .content.pf *, .pf-shop, .pf-shop * {
    font-family: "CwComic", "Comic Sans MS", "Comic Sans", cursive !important;
  }
  /* the shop button in the phone title bar */
  #shopBtnM { padding: 0 5px; }
  #shopBtnM .pix { width: 16px; height: 16px; }
  /* Comic Sans draws × and the window buttons tiny: keep those glyphs in the site font, a bit bigger */
  .pf-tbs a.pf-tb { font-family: "Times New Roman", Times, serif !important; font-size: 20px !important; }
  .content.pf .box-title::after { font-family: "Times New Roman", Times, serif; }

  /* after site.css */
  body:not(.home) .content.pf { max-width: 780px; }
  body:not(.home) .pf .box-body { padding: 16px; line-height: 1.3; }
  /* desktop: keep the start/pause menus inside the board even when it's at its smallest */
  @media (min-width: 721px) {
    .pf-overlay { padding: 6px; }
    .pf-dialog .db { padding: 10px 10px 10px; gap: 8px; }
  }

  /* ===== phones: the game takes the whole screen ===== */
  @media (max-width: 720px) {
    html, body { height: 100%; }
    body { overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; }
    .wrap { height: 100%; margin: 0 !important; display: flex; flex-direction: column; border: 0 !important; box-shadow: none !important; }
    .header, .goldbar, .navbar, .footer { display: none !important; }
    body:not(.home) .content.pf { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px; max-width: none; width: 100%; box-sizing: border-box; }
    .pf .box-title { display: flex; align-items: center; justify-content: space-between; padding: 2px 3px 2px 8px; }
    .pf .box-title::after { display: none; }
    .pf-tbs { display: flex; gap: 4px; }
    .pf-tb { font: bold 13px "Times New Roman", Times, serif; color: #000 !important; background: #c0c0c0; border: 2px outset #fff;
      min-width: 26px; height: 24px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .pf-tb.on { border-style: inset; }
    body:not(.home) .pf .box-body { flex: 1; min-height: 0; margin: 0; padding: 6px; background: #c0c0c0; box-sizing: border-box;
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas: "hold board next" "stats board next" ". board next" "strip strip strip" "pads pads pads";
      gap: 6px; align-items: start; }
    .pf-side, .pf-board-area { display: contents; }
    .pf-hold { grid-area: hold; } .pf-next { grid-area: next; } .pf-stats-wrap { grid-area: stats; }
    .pf-hold, .pf-next, .pf-stats-wrap { min-width: 0; }

    .pf-stats { grid-template-columns: 1fr; }
    .pf-stats > div { border: 0; padding: 0 5px; text-align: left; }

    .pf-strip .pf-power { flex: 0 0 54px; height: auto; margin: 0; }
    .pf-strip .pf-power i { background: #b07be0; }

    .pf-dialog { max-width: 320px; }
  }
  @media (max-width: 720px) and (pointer: fine) { .pf-pads { display: none !important; } }
