<title>Cole's Website</title>
<style>
  body {
    background: #ffffff;
    font-family: "Times New Roman", Times, serif;
    color: #000;
    margin: 0;
    padding: 0;
  }
  /* HEADER */
  /* BANNER ADS */
  .banners {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #f5f5f5;
  }
  .banner {
    flex: 1;
    border: 4px double #fff;
    padding: 14px 8px;
    text-align: center;
    color: #ffee00;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  .banner.blue { background: #1414c8; border-color: #6a6aff; }
  .banner.green { background: #0a7d1e; border-color: #6aff8a; }
  .banner .big { font-size: 20px; }
  .banner .small { font-size: 12px; margin-top: 6px; color: #baffc9; }
  .banner.blue .small { color: #c9d4ff; }
  /* LAYOUT */
  .content {
    display: flex;
    padding: 18px 20px;
    gap: 18px;
    align-items: flex-start;
  }
  .col-left { width: 210px; flex-shrink: 0; }
  .col-main { flex: 1; min-width: 0; }
  .col-right { width: 280px; flex-shrink: 0; }
  /* welcome: one clear sentence, three clear things to do */
  .h-welcome { padding: 16px 18px !important; font-size: 15px !important; }
  .h-welcome p { margin: 0 0 8px; }
  .h-hi { font-size: 21px; font-weight: bold; color: #000080; }
  .h-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .h-btn, .h-btn:visited { display: inline-block; font: bold 16px "Times New Roman", Times, serif; color: #000 !important;
    text-decoration: none !important; background: #c0c0c0; border: 3px outset #fff; padding: 8px 16px; }
  .h-btn:hover { background: #d4d4d4; }
  .h-btn:active { border-style: inset; }
  .h-btn.go { background: #b4ebcf; font-size: 17px; }
  .h-btn.go:hover { background: #c8f5dc; }
  .h-btn.mail { background: #ffff66; display: block; text-align: center; }
  .h-btn.mail:hover { background: #ffff99; }
  /* explore: every section once, as desktop icons */
  .h-tiles { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px !important; }
  .h-tile, .h-tile:visited { display: flex; gap: 12px; align-items: center; padding: 8px; color: #000 !important;
    text-decoration: none !important; border: 2px solid transparent; }
  .h-tile:hover { background: #e8e8ff; border: 2px dotted #000080; }
  .h-tile:hover b { color: #cc0000; }
  .h-ico { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    font: bold 24px "Times New Roman", Times, serif; color: #fff; border: 3px outset #fff; text-shadow: 1px 1px 0 #000; }
  .h-g { background: #0a7d1e; } .h-m { background: #6040c0; } .h-d { background: #0067c0; } .h-a { background: #c06000; }
  .h-f { background: #008080; } .h-r { background: #c0a000; } .h-i { background: #c00040; }
  .h-txt { display: flex; flex-direction: column; font-size: 13px; color: #333; line-height: 1.35; }
  .h-txt b { font-size: 16px; color: #0000cc; text-decoration: underline; }
  .h-name { display: flex; align-items: center; gap: 6px; }
  .h-tag { display: inline-block; font: bold 10px Arial, sans-serif; color: #fff; background: #cc0000; padding: 1px 4px; text-decoration: none; }
  .h-tag.soon { background: #808080; }
  /* sidebar */
  .h-hire { font-size: 14px !important; }
  .h-hire p { margin: 0 0 10px; }
  .h-addr { margin: 8px 0 0 !important; font-size: 12px; color: #444; text-align: center; }
  .h-news ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .h-news li { margin-bottom: 8px; border: 0 !important; padding: 0 !important; }
  .box-body {
    border: 1px solid #ccc;
    border-top: none;
    padding: 10px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .col-left ul, .col-right ul { list-style: none; margin: 0; padding: 0; }
  .col-left li { padding: 4px 0; border-bottom: 1px dotted #ccc; font-size: 13px; }
  .col-left .count { color: #666; }
  table.listing {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 20px;
  }
  table.listing th {
    background: #6699cc;
    color: #fff;
    font-family: "Times New Roman", Times, serif;
    text-align: left;
    padding: 8px 10px;
    font-size: 12px;
  }
  table.listing td {
    padding: 10px;
    border-bottom: 1px solid #dde;
    vertical-align: top;
  }
  table.listing a.title { font-weight: bold; font-size: 14px; }
  .new-tag {
    background: #cc0000;
    color: #fff;
    font-size: 10px;
    font-family: "Times New Roman", Times, serif;
    padding: 2px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .review-entry { margin-bottom: 14px; }
  .review-entry a { font-weight: bold; font-size: 14px; }
  .review-entry .soon { color: #cc0000; font-size: 11px; font-weight: bold; margin-left: 8px; animation: cw-blink 1s step-start infinite; }
  .review-entry .snippet { font-size: 13px; color: #333; margin-top: 2px; }
  .col-right li {
    padding: 5px 0;
    border-bottom: 1px dotted #ccc;
    font-size: 13px;
  }
  @keyframes blinker {
    50% { opacity: 0; }
  }
  .blink {
    animation: blinker 1s step-start infinite;
  }
  .hitcounter {
    text-align: center;
    padding: 16px;
    font-family: "Times New Roman", Times, serif;
    font-size: 12px;
    color: #444;
  }
  .hitcounter .digits {
    display: inline-block;
    background: #000;
    color: #00ff00;
    font-family: "Times New Roman", Times, serif;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 4px 10px;
    border: 2px inset #999;
    margin-top: 4px;
  }
  .counter-wrap {
    position: relative;
    display: inline-block;
  }
  .crack-overlay {
    position: absolute;
    top: -6px;
    left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    pointer-events: none;
  }
  .oops {
    margin-top: 8px;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    color: #cc0000;
    font-size: 15px;
    font-weight: bold;
    transform: rotate(-2deg);
  }
