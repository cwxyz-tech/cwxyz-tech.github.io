<style>
  body {
    background: #ffffff;
    font-family: "Times New Roman", Times, serif;
    color: #000;
    margin: 0;
    padding: 0;
  }
  /* HEADER */
  /* BANNER ADS */
  .banners {
    display: flex;
    gap: 6px;
    padding: 10px;
    background: #f5f5f5;
  }
  .banner {
    flex: 1;
    border: 4px double #fff;
    padding: 14px 8px;
    text-align: center;
    color: #ffee00;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  .banner.blue { background: #1414c8; border-color: #6a6aff; }
  .banner.green { background: #0a7d1e; border-color: #6aff8a; }
  .banner .big { font-size: 20px; }
  .banner .small { font-size: 12px; margin-top: 6px; color: #baffc9; }
  .banner.blue .small { color: #c9d4ff; }
  /* LAYOUT */
  .content {
    display: flex;
    padding: 18px 20px;
    gap: 18px;
    align-items: flex-start;
  }
  .col-left { width: 210px; flex-shrink: 0; }
  .col-main { flex: 1; min-width: 0; }
  .col-right { width: 240px; flex-shrink: 0; }
  .box-body {
    border: 1px solid #ccc;
    border-top: none;
    padding: 10px;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .col-left ul, .col-right ul { list-style: none; margin: 0; padding: 0; }
  .col-left li { padding: 4px 0; border-bottom: 1px dotted #ccc; font-size: 13px; }
  .col-left .count { color: #666; }
  table.listing {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 20px;
  }
  table.listing th {
    background: #6699cc;
    color: #fff;
    font-family: "Times New Roman", Times, serif;
    text-align: left;
    padding: 8px 10px;
    font-size: 12px;
  }
  table.listing td {
    padding: 10px;
    border-bottom: 1px solid #dde;
    vertical-align: top;
  }
  table.listing a.title { font-weight: bold; font-size: 14px; }
  .new-tag {
    background: #cc0000;
    color: #fff;
    font-size: 10px;
    font-family: "Times New Roman", Times, serif;
    padding: 2px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .review-entry { margin-bottom: 14px; }
  .review-entry a { font-weight: bold; font-size: 14px; }
  .review-entry .soon { color: #cc0000; font-size: 11px; font-weight: bold; margin-left: 8px; animation: cw-blink 1s step-start infinite; }
  .review-entry .snippet { font-size: 13px; color: #333; margin-top: 2px; }
  .col-right li {
    padding: 5px 0;
    border-bottom: 1px dotted #ccc;
    font-size: 13px;
  }
  @keyframes blinker {
    50% { opacity: 0; }
  }
  .blink {
    animation: blinker 1s step-start infinite;
  }
  .hitcounter {
    text-align: center;
    padding: 16px;
    font-family: "Times New Roman", Times, serif;
    font-size: 12px;
    color: #444;
  }
  .hitcounter .digits {
    display: inline-block;
    background: #000;
    color: #00ff00;
    font-family: "Times New Roman", Times, serif;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 4px 10px;
    border: 2px inset #999;
    margin-top: 4px;
  }
  .counter-wrap {
    position: relative;
    display: inline-block;
  }
  .crack-overlay {
    position: absolute;
    top: -6px;
    left: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    pointer-events: none;
  }
  .oops {
    margin-top: 8px;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    color: #cc0000;
    font-size: 15px;
    font-weight: bold;
    transform: rotate(-2deg);
  }
</style>
