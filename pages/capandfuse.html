<script>/* opened straight from /pages/? send it to the real page, behind the terms */ if (location.pathname.indexOf("/pages/") === 0) location.replace("/" + location.pathname.slice(7).replace(/\.html$/, "").replace(/^(home|404)$/, "").replace(/^[\/\\]+/, ""));</script>
<link rel="stylesheet" href="/capandfuse/game.css?v=5">
<div id="cfGame">
  <canvas id="cfCanvas" aria-label="Cap and Fuse game"></canvas>
  <div id="cfUI"></div>
  <div id="cfFps" hidden></div>
  <div id="cfSaving" aria-hidden="true">Saving&hellip;</div>
  <a id="cfExit" href="/games" title="Back to the games">&#10005;</a>
  <noscript><p class="cf-noscript">Cap &amp; Fuse needs JavaScript turned on.</p></noscript>
  <div id="cfLoader">
    <div class="cf-loadlogo">Cap <span>&amp;</span> Fuse<small>Chapter 1</small></div>
    <div class="cf-boot" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="cf-loadbar"><i id="cfLoadBar"></i></div>
    <div id="cfLoadText">Loading...</div>
  </div>
</div>
<script>
(function () {
  var errs = [];
  function show(msg) {
    var t = document.getElementById("cfLoadText"), L = document.getElementById("cfLoader");
    if (!t || !L || L.classList.contains("done")) return;
    var safe = /[?&]safe=1/.test(location.search);
    t.innerHTML = "";
    var box = document.createElement("div"); box.className = "cf-loaderr";
    var p = document.createElement("p"); p.textContent = msg || "Cap & Fuse is taking too long to start."; box.appendChild(p);
    if (errs.length) { var d = document.createElement("code"); d.textContent = errs.slice(-3).join("\n"); box.appendChild(d); }
    var b1 = document.createElement("button"); b1.textContent = "Reload"; b1.onclick = function () { location.reload(); }; box.appendChild(b1);
    if (!safe) { var b2 = document.createElement("button"); b2.textContent = "Try low graphics"; b2.onclick = function () { location.href = location.pathname + "?safe=1"; }; box.appendChild(b2); }
    t.appendChild(box);
  }
  window.cfShowError = function (m) { errs.push(String(m)); show("Cap & Fuse couldn't start."); };
  window.addEventListener("error", function (e) {
    var el = e.target;
    if (el && el.tagName === "SCRIPT") { errs.push("couldn't load " + (el.src || "a game file").split("/").pop()); show("Cap & Fuse couldn't load one of its files."); return; }
    errs.push((e.message || "error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
    if (!window.cfGame) show("Cap & Fuse hit an error while loading.");
  }, true);
  window.addEventListener("unhandledrejection", function (e) { errs.push("promise: " + (e.reason && (e.reason.message || e.reason))); });
  setTimeout(function () { if (!window.cfGame) show(errs.length ? "Cap & Fuse hit an error while loading." : "Cap & Fuse is taking too long to start."); }, 20000);
})();
</script>
<script type="module" src="/capandfuse/js/main.js?v=10"></script>
